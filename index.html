<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Language Flashcards</title>
  <!-- Data URI favicon to avoid 404 -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
  <div class="app-wrapper">
    <!-- Header -->
    <header class="app-header">
      <div class="header-content">
        <button id="backBtn" class="back-btn" aria-label="Go back">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <h1>Language Flashcards</h1>
        <div class="header-actions">
          <label class="dark-mode-toggle">
            <input type="checkbox" id="darkModeToggle" />
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Language Selector -->
      <div class="language-selector">
        <div class="language-tabs">
          <button class="language-tab active" data-lang="da">
            <img src="flags/dk.png" alt="Danish" class="flag-icon" />
            <span>Danish</span>
          </button>
          <button class="language-tab" data-lang="fa">
            <img src="flags/fa.png" alt="Persian" class="flag-icon" />
            <span>Persian</span>
          </button>
          <button class="language-tab" data-lang="pt">
            <img src="flags/pt.png" alt="Portuguese" class="flag-icon" />
            <span>Portuguese</span>
          </button>
        </div>
      </div>

      <!-- Category Selector -->
      <div class="category-section">
        <select id="category" class="category-select">
          <!-- Filled by JavaScript -->
        </select>
      </div>

      <!-- Progress -->
      <div class="progress-section">
        <div class="progress-info">
          <span class="progress-text" id="progressText">0/0</span>
        </div>
        <div class="progress-track">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>

      <!-- Flashcard -->
      <div class="flashcard-container">
        <div class="flashcard" id="flashcard" role="button" tabindex="0" aria-label="Flashcard - click to flip">
          <div class="flashcard-inner">
            <div class="flashcard-front">
              <div class="card-image">
                <img id="cardImage" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200' viewBox='0 0 200 200'><rect width='100%' height='100%' fill='%23f8f9fa'/><text x='50%' y='50%' font-family='system-ui' font-size='16' fill='%23999' text-anchor='middle' dy='.3em'>Loading image</text></svg>" alt="Flashcard image" />
              </div>
              <div class="card-content">
                <div class="word-display" id="cardWordFront">Loading...</div>
              </div>
            </div>
            <div class="flashcard-back">
              <div class="card-content">
                <div class="word-display large-word" id="cardWordBack">Loading...</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Flip Hint -->
      <div class="flip-hint">
        Tap card to flip for English
      </div>

      <!-- Controls -->
      <div class="controls-section">
        <button id="prevBtn" class="control-btn nav-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
          </svg>
        </button>
        
        <button id="playAudioBtn" class="control-btn audio-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </button>
        
        <button id="nextBtn" class="control-btn nav-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
          </svg>
        </button>
      </div>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
